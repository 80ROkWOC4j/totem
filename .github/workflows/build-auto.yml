name: Auto Build Firmware

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "images/**"
      - "keymap-drawer/**"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw.yml"
      - ".gitignore"

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.detect.outputs.firmware }}
      bootloader: ${{ steps.detect.outputs.bootloader }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide build scope
        id: detect
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # Compare a new branch with main, rather than treating every file as new.
            BASE=$(git merge-base origin/main "$HEAD")
          fi
          git diff --name-only "$BASE" "$HEAD" | python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.firmware != 'none' || needs.detect-changes.outputs.bootloader == 'true'
    uses: ./.github/workflows/build-reusable.yml
    with:
      archive_name: auto
      build_matrix_path: ${{ needs.detect-changes.outputs.firmware == 'smoke' && '.github/build-matrices/smoke.yaml' || 'build.yaml' }}
      build_firmware: ${{ needs.detect-changes.outputs.firmware != 'none' }}
      build_bootloader: ${{ needs.detect-changes.outputs.bootloader == 'true' }}
      retention_days: 7
